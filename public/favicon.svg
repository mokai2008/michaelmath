  <rect x="33" y="33" width="446" height="446" rx="111" fill="none" stroke="url(#innerGlow)" stroke-width="4" />

  <!-- Mastercrafted Mathematical Pi -->
  <g filter="url(#dropShadow)">
    <path 
      d="M 100 178 C 100 152 122 136 154 136 L 368 136 C 394 136 412 148 412 168 C 412 186 396 196 374 196 L 348 196 L 348 316 C 348 350 368 366 394 366 C 404 366 414 362 420 354 C 424 372 408 388 384 388 C 332 388 296 354 296 312 L 296 196 L 224 196 L 208 336 C 206 356 192 368 172 368 C 150 368 138 354 140 338 L 158 196 L 126 196 C 108 196 100 188 100 178 Z" 
